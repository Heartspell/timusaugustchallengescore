name: Update scoreboard

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - "authors.txt"
      - "tasks.txt"
      - "scripts/update-scoreboard.mjs"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-scoreboard.mjs
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Timus scoreboard"
          file_pattern: data/scoreboard.json
