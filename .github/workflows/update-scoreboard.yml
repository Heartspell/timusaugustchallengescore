name: Update scoreboard

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - "authors.txt"
      - "tasks.txt"
      - "scripts/update-scoreboard.mjs"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    outputs:
      changed: ${{ steps.scoreboard.outputs.changed }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-scoreboard.mjs
      - name: Check scoreboard changes
        id: scoreboard
        run: |
          if git diff --quiet -- data/scoreboard.json; then
            echo "Scoreboard unchanged; asset version left as is."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            node -e 'const fs=require("fs"); const path="index.html"; const version=process.env.GITHUB_RUN_NUMBER || Date.now().toString(); const html=fs.readFileSync(path,"utf8"); const next=html.replace(/(style\.css\?v=)[^"]+/g, "$1"+version).replace(/(app\.js\?v=)[^"]+/g, "$1"+version); fs.writeFileSync(path,next); console.log("asset version: "+version);'
          fi
      - uses: stefanzweifel/git-auto-commit-action@v5
        if: steps.scoreboard.outputs.changed == 'true'
        with:
          commit_message: "Update Timus scoreboard"
          file_pattern: data/scoreboard.json index.html
      - uses: actions/configure-pages@v5
        if: github.ref_name == 'main' && (steps.scoreboard.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
      - name: Build static artifact
        if: github.ref_name == 'main' && (steps.scoreboard.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          mkdir -p _site/data
          cp index.html style.css app.js authors.txt tasks.txt .nojekyll _site/
          cp data/scoreboard.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref_name == 'main' && (steps.scoreboard.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        with:
          path: _site
  deploy:
    needs: update
    if: github.ref_name == 'main' && (needs.update.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
