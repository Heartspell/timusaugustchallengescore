name: Update scoreboard

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - "authors.txt"
      - "tasks.txt"
      - "scripts/update-scoreboard.mjs"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-scoreboard.mjs
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Timus scoreboard"
          file_pattern: data/scoreboard.json
      - uses: actions/configure-pages@v5
      - name: Build static artifact
        run: |
          mkdir -p _site/data
          cp index.html style.css app.js authors.txt tasks.txt .nojekyll _site/
          cp data/scoreboard.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
